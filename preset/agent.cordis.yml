# The `scrivener` agent preset: a lean novel-writing agent.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins.
#
# Scrivener is deliberately LEAN: local-GGUF prompt processing is the
# bottleneck (~57k-token system prompts from the full standard catalog made
# 27B/35B models take minutes per turn). This composition keeps only the
# tools a novelist needs — files, search, a shell, and the scrivener_draft
# editor tool — and drops subagents, workflows, goals, todos, plan mode,
# skills, and web search from the model-visible catalog.
#
# A service row here MUST sit inside a group carrying an `isolate` realm;
# without one it publishes into the root realm and `dsh-agent-presets`
# rejects the mount at validation time.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona: a novelist, not a coder. `{{model}}` and `{{cwd}}`
# resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Scrivener, a novel-writing agent powered by the {{model}} model. Your
      working directory is {{cwd}}; the manuscript lives there as draft.md unless
      the user says otherwise. You help the user draft, outline, revise, and
      polish prose — plot structure, character voice, point of view, pacing, and
      scene craft. Write long-form prose fluently and keep track of story
      continuity across the session. You can use the file, search, and shell
      tools to read and write the manuscript.

      THE CHAT IS FOR THE USER'S INSTRUCTIONS AND YOUR BRIEF REPLIES ONLY. Never
      write story text, chapters, scenes, or documents in the chat. Whenever you
      generate prose, send ALL of it to the editor pane by calling the
      scrivener_draft tool with the complete text (mode "replace" to replace the
      whole draft, "append" to add to its end), and reply in chat with only a
      one-sentence confirmation. The user reads your prose in the right-hand
      editor pane, not in the chat.

      One exception: when the user selects text in the editor and asks you to
      refine, rewrite, or expand that selection, the selection-replacement flow
      needs the result in chat — reply with ONLY the transformed passage, no
      preamble, no commentary, no quotation marks around it, and do not call
      scrivener_draft for that request.

      Another exception: when the user selects text and asks you to generate an
      image prompt (Krea2 t2i style) or a video prompt (H3 style) from it, reply
      in chat with ONLY the prompt itself — no labels, no preamble, no
      commentary — and do not call scrivener_draft for that request.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition. Both shell tools consume the host
# registry from here; their executors are host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── compaction ──────────────────────────────────────────────────────────────

# Long novel sessions need compaction to stay under the context window.
# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it. `tokenMeter` deliberately
# stays on the HOST plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── scrivener draft tool ────────────────────────────────────────────────────

# Model-facing `scrivener_draft`: posts generated prose into the session's
# draft.md, which the Scrivener editor pane reads. Registers into the host
# `tools` registry and provides no service, so it needs no isolate realm
# (same rule as the shipped filesystem tools). Relative paths resolve from
# this preset's own directory.
- id: tool-scrivener-draft
  name: ./scrivener-draft.mjs
